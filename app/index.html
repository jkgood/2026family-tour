<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-title" content="2026秋之旅" />
    <meta name="application-name" content="2026秋之旅" />
    <title>2026秋之旅</title>
    <script>
      // 手機「加入主畫面」的圖示需要 PNG：把 SVG 圖示即時轉成 180x180 PNG
      (function () {
        try {
          var img = new Image();
          img.onload = function () {
            var c = document.createElement('canvas');
            c.width = 180;
            c.height = 180;
            c.getContext('2d').drawImage(img, 0, 0, 180, 180);
            var link = document.querySelector('link[rel="apple-touch-icon"]');
            if (link) link.href = c.toDataURL('image/png');
          };
          img.src = '/favicon.svg';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
