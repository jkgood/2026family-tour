<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#dc5a1c"/>
    </linearGradient>
    <path id="wing" d="M146 262 C90 250 56 215 44 168 C82 184 108 188 128 196 C102 200 92 214 100 226 C118 226 132 232 146 238 Z"/>
    <path id="leaf" d="M0 -40 L9 -22 L26 -28 L20 -8 L38 -6 L24 8 L30 24 L8 18 L4 44 L-4 44 L-8 18 L-30 24 L-24 8 L-38 -6 L-20 -8 L-26 -28 L-9 -22 Z"/>
  </defs>

  <!-- 秋天的天空 -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="404" cy="112" r="54" fill="#fff7d6" opacity="0.85"/>

  <!-- 牧場山丘 -->
  <path d="M0 360 Q130 290 260 340 T512 320 V512 H0 Z" fill="#b45309" opacity="0.55"/>
  <path d="M0 412 Q150 350 300 396 T512 380 V512 H0 Z" fill="#92400e"/>

  <!-- 楓葉 -->
  <use href="#leaf" transform="translate(92 118) rotate(-22)" fill="#dc2626"/>
  <use href="#leaf" transform="translate(436 292) rotate(24) scale(0.7)" fill="#b91c1c"/>
  <use href="#leaf" transform="translate(70 330) rotate(14) scale(0.55)" fill="#f59e0b"/>

  <!-- 飛牛的翅膀 -->
  <use href="#wing" fill="#fffbea" stroke="#f3d9a4" stroke-width="5" stroke-linejoin="round"/>
  <use href="#wing" fill="#fffbea" stroke="#f3d9a4" stroke-width="5" stroke-linejoin="round" transform="translate(512 0) scale(-1 1)"/>

  <!-- 牛角 -->
  <path d="M188 178 Q166 128 138 138 Q160 150 168 196 Z" fill="#f5e6c8" stroke="#d9c39a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M324 178 Q346 128 374 138 Q352 150 344 196 Z" fill="#f5e6c8" stroke="#d9c39a" stroke-width="4" stroke-linejoin="round"/>

  <!-- 牛耳 -->
  <ellipse cx="150" cy="212" rx="40" ry="22" transform="rotate(-24 150 212)" fill="#ffffff"/>
  <ellipse cx="150" cy="212" rx="24" ry="12" transform="rotate(-24 150 212)" fill="#f9b4b4"/>
  <ellipse cx="362" cy="212" rx="40" ry="22" transform="rotate(24 362 212)" fill="#ffffff"/>
  <ellipse cx="362" cy="212" rx="24" ry="12" transform="rotate(24 362 212)" fill="#f9b4b4"/>

  <!-- 牛頭 -->
  <ellipse cx="256" cy="255" rx="112" ry="100" fill="#ffffff"/>
  <ellipse cx="198" cy="204" rx="42" ry="34" transform="rotate(-18 198 204)" fill="#2b2118"/>
  <ellipse cx="322" cy="200" rx="26" ry="22" transform="rotate(14 322 200)" fill="#2b2118"/>

  <!-- 眼睛 -->
  <circle cx="214" cy="252" r="12" fill="#2b2118"/>
  <circle cx="218" cy="248" r="4" fill="#ffffff"/>
  <circle cx="298" cy="252" r="12" fill="#2b2118"/>
  <circle cx="302" cy="248" r="4" fill="#ffffff"/>

  <!-- 鼻口 -->
  <ellipse cx="256" cy="306" rx="68" ry="46" fill="#f9b4b4"/>
  <ellipse cx="232" cy="308" rx="9" ry="13" fill="#b4505a"/>
  <ellipse cx="280" cy="308" rx="9" ry="13" fill="#b4505a"/>
</svg>
